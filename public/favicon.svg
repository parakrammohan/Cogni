<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black-on-transparent monochrome favicon to match the Cogni
       wordmark (public/cogni_logo.svg). Stylised C with a heart on the
       opening — same heart-as-the-i-dot idea as the logo. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <!-- Open "C" stroke. Cap drawn off-center to suggest forward motion. -->
  <path d="M44 22 C40 18 34 17 28 19 C20 22 17 30 18 36 C19 43 25 47 32 47 C37 47 41 45 44 42"
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small heart at the upper-right opening of the C — same accent the
       Cogni wordmark uses for the dot on the i. -->
  <path d="M44 20 c -1.5 -2.4 -5.5 -1.9 -6 1.2 c -0.3 1.6 0.8 3.4 6 6.2 c 5.2 -2.8 6.3 -4.6 6 -6.2 c -0.5 -3.1 -4.5 -3.6 -6 -1.2 z"
        fill="white"/>
</svg>
